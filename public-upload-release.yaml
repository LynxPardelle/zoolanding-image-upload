AWSTemplateFormatVersion: '2010-09-09'
Description: Private versioned release artifacts for the Zoolanding public image uploader
Resources:
  PublicUploadArtifacts:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub zlp-public-image-releases-${AWS::AccountId}-${AWS::Region}
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
  PublicUploadArtifactPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PublicUploadArtifacts
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: ReadVersionedPublicRelease
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/zoolanding-deployer-image-upload-production-cfn-exec
            Action:
              - s3:GetObject
              - s3:GetObjectVersion
            Resource: !Sub ${PublicUploadArtifacts.Arn}/releases/*
          - Sid: RequireTLS
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt PublicUploadArtifacts.Arn
              - !Sub ${PublicUploadArtifacts.Arn}/*
            Condition:
              Bool:
                aws:SecureTransport: 'false'
